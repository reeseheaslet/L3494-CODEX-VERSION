{% extends "base.html" %}
{% block title %}Create Event · Local 3494{% endblock %}

{% block content %}

<!-- Page Banner -->
<section class="bg-navy text-white py-12">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
        <h1 class="font-heading font-bold text-3xl md:text-4xl text-white">Create Event</h1>
        <a href="/members/events" class="bg-navy-light hover:bg-navy text-white font-semibold px-5 py-2.5 rounded transition text-sm whitespace-nowrap self-start sm:self-auto">
            ← Back to Events
        </a>
    </div>
</section>

<!-- Divider bar -->
<div class="h-1 bg-gradient-to-r from-fire via-red-400 to-fire"></div>

<!-- Main Content -->
<section class="py-12 bg-gray-50">
    <div class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-8">

        <!-- Back Button -->
        <div class="mb-4">
            <a href="/members" class="inline-flex items-center gap-1 text-gray-500 hover:text-fire text-sm font-medium transition">
                ← Back to Member Portal
            </a>
        </div>

        <div class="bg-white rounded-lg border border-gray-200 shadow-sm p-8">
            <form id="create-event-form" method="POST" action="/members/events/create" class="space-y-6">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <!-- Title -->
                <div>
                    <label class="block text-sm font-semibold text-navy mb-1">Title *</label>
                    <input type="text" name="title" required placeholder="Event title" class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:border-fire focus:outline-none focus:ring-1 focus:ring-fire">
                </div>

                <!-- Date and Time -->
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-navy mb-1">Date *</label>
                        <input type="date" name="event_date" required class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:border-fire focus:outline-none focus:ring-1 focus:ring-fire">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-navy mb-1">Time</label>
                        <input type="time" name="event_time" class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:border-fire focus:outline-none focus:ring-1 focus:ring-fire">
                    </div>
                </div>

                <!-- Location -->
                <div>
                    <label class="block text-sm font-semibold text-navy mb-1">Location *</label>
                    <input type="text" name="location" required placeholder="Event location" class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:border-fire focus:outline-none focus:ring-1 focus:ring-fire">
                </div>

                <!-- Description -->
                <div>
                    <label class="block text-sm font-semibold text-navy mb-1">Description</label>
                    <textarea name="description" rows="4" placeholder="Event details and description..." class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:border-fire focus:outline-none focus:ring-1 focus:ring-fire"></textarea>
                </div>

                <!-- Visibility Checkboxes -->
                <div>
                    <label class="block text-sm font-semibold text-navy mb-3">Visibility</label>
                    <div class="space-y-2">
                        <label class="flex items-center cursor-pointer">
                            <input type="checkbox" name="visibility_public_homepage" value="1" class="w-4 h-4 text-fire rounded focus:ring-fire">
                            <span class="ml-2 text-sm text-gray-700">Show on public homepage</span>
                        </label>
                        <label class="flex items-center cursor-pointer">
                            <input type="checkbox" name="visibility_member_portal" value="1" checked class="w-4 h-4 text-fire rounded focus:ring-fire">
                            <span class="ml-2 text-sm text-gray-700">Show in member portal</span>
                        </label>
                        <label class="flex items-center cursor-pointer">
                            <input type="checkbox" name="visibility_family_section" value="1" class="w-4 h-4 text-fire rounded focus:ring-fire">
                            <span class="ml-2 text-sm text-gray-700">Show in family section</span>
                        </label>
                    </div>
                </div>

                <!-- Enable Signups -->
                <div>
                    <label class="flex items-center cursor-pointer">
                        <input type="checkbox" name="signup_enabled" value="1" class="w-4 h-4 text-fire rounded focus:ring-fire">
                        <span class="ml-2 text-sm font-semibold text-navy">Enable Signups</span>
                    </label>
                </div>

                <!-- Submit Button -->
                <div class="pt-4 border-t border-gray-100">
                    <button id="create-event-submit" type="submit" class="w-full bg-fire hover:bg-fire-dark text-white font-semibold py-2.5 rounded transition disabled:opacity-60 disabled:cursor-not-allowed">
                        <span class="submit-label">Create Event</span>
                    </button>
                    <p id="create-event-status" class="sr-only" role="status" aria-live="polite"></p>
                </div>
            </form>
        </div>
    </div>
</section>

<script>
document.getElementById('create-event-form').addEventListener('submit', function(event) {
    const form = event.currentTarget;
    const submitButton = document.getElementById('create-event-submit');
    const status = document.getElementById('create-event-status');

    if (form.dataset.submitting === 'true') {
        event.preventDefault();
        return;
    }

    form.dataset.submitting = 'true';
    submitButton.disabled = true;
    submitButton.setAttribute('aria-disabled', 'true');
    submitButton.querySelector('.submit-label').innerHTML = `
        <span class="inline-flex items-center justify-center gap-2">
            <svg class="animate-spin h-4 w-4" viewBox="0 0 24 24" aria-hidden="true">
                <circle class="opacity-25" cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
            </svg>
            Creating Event&hellip;
        </span>`;
    status.textContent = 'Creating event. Please wait.';
});
</script>

{% endblock %}
