{% extends "base.html" %}
{% block title %}Member Login · Local 3494{% endblock %}

{% block content %}
<section class="bg-navy py-12">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="text-fire font-heading font-semibold text-xs uppercase tracking-widest mb-2">Member Access</div>
        <h1 class="font-heading font-bold text-3xl text-white">Member Login</h1>
    </div>
</section>
<div class="h-1 bg-gradient-to-r from-fire via-red-400 to-fire"></div>

<section class="py-16 bg-gray-50">
    <div class="max-w-md mx-auto px-4">
        <div class="bg-white rounded-lg border border-gray-200 shadow-sm overflow-hidden">
            <div class="bg-navy px-8 py-5 flex items-center gap-3">
                <div class="w-8 h-8 bg-fire rounded flex items-center justify-center">
                    <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                </div>
                <div class="text-white font-heading font-bold">Local 3494</div>
            </div>
            <div class="p-8">
                <form method="POST" action="/login" class="space-y-5">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div>
                        <label for="email" class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-2">Email Address</label>
                        <input type="email" id="email" name="email" required placeholder="your@email.com"
                            class="w-full px-4 py-2.5 border border-gray-300 rounded text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-fire/30 focus:border-fire transition">
                    </div>
                    <div>
                        <label for="password" class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-2">Password</label>
                        <input type="password" id="password" name="password" required placeholder="••••••••"
                            class="w-full px-4 py-2.5 border border-gray-300 rounded text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-fire/30 focus:border-fire transition">
                    </div>
                    <button type="submit" class="w-full bg-fire hover:bg-fire-dark text-white font-heading font-bold py-3 rounded transition text-sm tracking-wide">
                        Sign In
                    </button>
                </form>
                <p class="text-center text-sm text-gray-500 mt-3">
                  <a href="{{ url_for('forgot_password') }}" class="text-fire hover:text-fire-dark font-semibold transition">Forgot your password?</a>
                </p>
                <p class="text-center text-gray-500 text-xs mt-6">
                    Don't have an account? <a href="/register" class="text-fire hover:text-fire-dark font-semibold transition">Register here.</a>
                </p>
                <p class="text-center text-gray-400 text-xs mt-2">
                    Need help? <a href="/contact" class="text-fire hover:text-fire-dark font-semibold transition">Contact your union representative.</a>
                </p>
            </div>
        </div>
    </div>
</section>
{% endblock %}
